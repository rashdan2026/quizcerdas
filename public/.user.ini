; Batas upload & resource PHP untuk aplikasi Kelas Merdeka.
; Berlaku untuk Plesk (PHP-FPM) dan Hostinger (LiteSpeed/FPM): file .user.ini
; dibaca per-direktori oleh PHP-FPM. Perubahan berlaku dalam ±5 menit
; (reload_fpm_interval); di Plesk bisa juga diatur via halaman PHP Settings.
upload_max_filesize = 16M
post_max_size = 16M
memory_limit = 512M
max_execution_time = 600
max_input_time = 300
