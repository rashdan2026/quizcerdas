<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Mahasiswa mengikuti perkuliahan digital</title>
  <desc id="desc">Ilustrasi mahasiswa mengakses materi dan kuis melalui laptop serta memindai QR absensi melalui smartphone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="560" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="470" cy="74" r="46" fill="#C7D2FE" opacity=".55"/>
  <circle cx="84" cy="330" r="58" fill="#BAE6FD" opacity=".6"/>
  <circle cx="500" cy="330" r="22" fill="#A7F3D0" opacity=".8"/>

  <!-- Laptop -->
  <g filter="url(#sh)">
    <rect x="112" y="86" width="308" height="196" rx="14" fill="#0F172A"/>
    <rect x="122" y="96" width="288" height="176" rx="8" fill="url(#screen)"/>
    <rect x="92" y="282" width="348" height="16" rx="8" fill="#1E293B"/>
    <rect x="150" y="298" width="232" height="6" rx="3" fill="#334155"/>
  </g>

  <!-- Screen: mini dashboard -->
  <rect x="136" y="110" width="120" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="136" y="128" width="260" height="56" rx="8" fill="url(#accent)" opacity=".12"/>
  <rect x="148" y="142" width="72" height="8" rx="4" fill="#4F46E5"/>
  <rect x="148" y="158" width="132" height="6" rx="3" fill="#94A3B8"/>

  <!-- quiz cards -->
  <g>
    <rect x="136" y="196" width="122" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="146" y="206" width="70" height="6" rx="3" fill="#64748B"/>
    <rect x="146" y="220" width="100" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="146" y="232" width="84" height="5" rx="2.5" fill="#CBD5E1"/>
    <circle cx="240" cy="236" r="7" fill="#DCFCE7"/>
    <path d="M237 236l2 2 4-4" stroke="#15803D" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="270" y="196" width="126" height="56" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="280" y="206" width="62" height="6" rx="3" fill="#64748B"/>
    <rect x="280" y="220" width="104" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="280" y="232" width="76" height="5" rx="2.5" fill="#CBD5E1"/>
    <rect x="360" y="230" width="26" height="12" rx="6" fill="#FFF7ED" stroke="#FED7AA"/>
    <text x="373" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#C2410C">00:45</text>
  </g>

  <!-- chart bars on screen bottom -->
  <g fill="#93C5FD">
    <rect x="136" y="266" width="10" height="16" rx="2"/>
    <rect x="152" y="258" width="10" height="24" rx="2"/>
    <rect x="168" y="250" width="10" height="32" rx="2" fill="#2563EB"/>
    <rect x="184" y="262" width="10" height="20" rx="2"/>
    <rect x="200" y="254" width="10" height="28" rx="2"/>
  </g>

  <!-- Phone with QR -->
  <g filter="url(#sh)">
    <rect x="398" y="160" width="104" height="186" rx="18" fill="#0F172A"/>
    <rect x="406" y="170" width="88" height="164" rx="12" fill="#FFFFFF"/>
    <rect x="432" y="175" width="36" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="420" y="190" width="60" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <!-- QR pattern -->
    <g fill="#0F172A">
      <rect x="427" y="197" width="16" height="16" rx="2"/>
      <rect x="457" y="197" width="16" height="16" rx="2"/>
      <rect x="427" y="227" width="16" height="16" rx="2"/>
      <rect x="431" y="201" width="8" height="8" fill="#FFFFFF"/>
      <rect x="461" y="201" width="8" height="8" fill="#FFFFFF"/>
      <rect x="431" y="231" width="8" height="8" fill="#FFFFFF"/>
      <rect x="447" y="197" width="4" height="4"/><rect x="447" y="207" width="4" height="4"/>
      <rect x="447" y="219" width="26" height="4"/><rect x="447" y="227" width="4" height="4"/>
      <rect x="455" y="227" width="4" height="4"/><rect x="463" y="227" width="4" height="4"/>
      <rect x="447" y="235" width="4" height="8"/><rect x="459" y="235" width="8" height="4"/>
    </g>
    <rect x="420" y="262" width="60" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="420" y="278" width="44" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="420" y="292" width="52" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="420" y="310" width="60" height="16" rx="8" fill="url(#accent)"/>
  </g>

  <!-- Floating success badge -->
  <g filter="url(#sh)">
    <rect x="72" y="176" width="118" height="46" rx="12" fill="#FFFFFF"/>
    <circle cx="94" cy="199" r="12" fill="#DCFCE7"/>
    <path d="M89 199l4 4 7-7" stroke="#15803D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="114" y="190" width="58" height="6" rx="3" fill="#334155"/>
    <rect x="114" y="202" width="42" height="5" rx="2.5" fill="#94A3B8"/>
  </g>

  <!-- Floating AI chip -->
  <g filter="url(#sh)">
    <rect x="58" y="258" width="126" height="42" rx="11" fill="#FFFFFF"/>
    <rect x="68" y="268" width="22" height="22" rx="7" fill="#7C3AED"/>
    <path d="M79 273v4M79 281v3M74 278h4M81 278h4M74 273l2 2M82 281l2 2M84 273l-2 2M76 281l-2 2" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="98" y="271" width="72" height="6" rx="3" fill="#4C1D95"/>
    <rect x="98" y="283" width="52" height="5" rx="2.5" fill="#C4B5FD"/>
  </g>
</svg>
